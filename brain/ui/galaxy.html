<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soul Galaxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* A full-bleed sky of the soul's mind: areas as constellations around the Mind,
   what it knows as stars, every thought/sense/action as a travelling pulse. */
:root {
  --bg: #05070b; --fg: #e2e8f1; --dim: #8592a6; --faint: rgba(226,232,241,.10);
  --panel: rgba(11,15,22,.80); --accent: #8fb0ff; --mode: dark; color-scheme: dark;
  --display: "Space Grotesk", "Avenir Next", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #edf0f4; --fg: #111822; --dim: #5b6677; --faint: rgba(17,24,34,.10);
    --panel: rgba(250,251,253,.86); --accent: #2f5bd3; --mode: light; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #edf0f4; --fg: #111822; --dim: #5b6677; --faint: rgba(17,24,34,.10);
  --panel: rgba(250,251,253,.86); --accent: #2f5bd3; --mode: light; color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#sky.dragging { cursor: grabbing; } #sky.pointing { cursor: pointer; }
.hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; gap: 10px;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); }
.hud > * { pointer-events: auto; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; min-width: 0; }
.brand h1 { margin: 0; font: 600 17px/1.1 var(--display); letter-spacing: .01em; }
.brand .sub { font: 400 11px/1.3 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.status { display: inline-flex; align-items: center; gap: 6px; font: 400 11px/1 var(--mono); color: var(--dim);
  padding: 7px 11px; border-radius: 999px; background: var(--panel); border: 1px solid var(--faint); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.status i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
.status[data-state="live"] i { background: #2fbf71; box-shadow: 0 0 8px #2fbf71; }
.status[data-state="think"] i { background: #f2b84b; box-shadow: 0 0 8px #f2b84b; }
.status[data-state="off"] i { background: #e05a4f; }
.status[data-state="dream"] i { background: #a98bff; box-shadow: 0 0 10px #a98bff; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .35; } }
.dreamtext { font: italic 400 12px/1.45 var(--body); color: var(--fg); opacity: .9; border-left: 2px solid #a98bff; padding-left: 8px; }
.caption { align-self: center; max-width: min(620px, 100%); font: 400 14px/1.45 var(--body); text-align: center; padding: 9px 16px;
  border-radius: 12px; background: var(--panel); border: 1px solid var(--faint); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: opacity .4s; }
.caption b { font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); display: block; margin-bottom: 4px; }
.spacer { flex: 1; pointer-events: none !important; }
.bottom { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px; max-width: 760px; }
.legend button { display: inline-flex; align-items: center; gap: 6px; font: 400 11px/1 var(--body); color: var(--fg); background: var(--panel);
  border: 1px solid var(--faint); border-radius: 999px; padding: 6px 9px; cursor: pointer; }
.legend button i { width: 7px; height: 7px; border-radius: 50%; }
.legend button span { color: var(--dim); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.legend button[aria-pressed="false"] { opacity: .45; }
.legend button:focus-visible, .feed button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.find { pointer-events: auto; font: 400 12px/1 var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--faint); border-radius: 999px;
  padding: 7px 12px; width: 210px; outline: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.find:focus-visible { border-color: var(--accent); }
.hint { margin-left: auto; font: 400 11px/1.4 var(--mono); color: var(--dim); text-align: right; }
.feed { position: absolute; z-index: 4; top: 64px; right: max(16px, env(safe-area-inset-right, 0px)); width: 320px; max-height: calc(100% - 150px);
  overflow: hidden; display: flex; flex-direction: column; gap: 4px; pointer-events: auto;
  mask-image: linear-gradient(to bottom, #000 70%, transparent); -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent); }
.feed h2 { margin: 0 0 4px; font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.item { display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: start; padding: 7px 9px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--faint); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font: 400 12px/1.35 var(--body); animation: drop .35s ease-out; }
.item i { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; }
.item .what { min-width: 0; overflow-wrap: anywhere; }
.item .what small { display: block; color: var(--dim); font: 400 10.5px/1.35 var(--mono); margin-top: 2px; }
.item time { font: 400 10px/1.6 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.item.err { border-color: rgba(224,90,79,.5); }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.tip { position: absolute; pointer-events: none; z-index: 5; max-width: 300px; background: var(--panel); border: 1px solid var(--faint); border-radius: 10px;
  padding: 9px 11px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font: 400 12px/1.4 var(--body); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.tip .k { font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); display: flex; gap: 6px; align-items: center; }
.tip .k i { width: 7px; height: 7px; border-radius: 50%; }
.tip h3 { margin: 5px 0 3px; font: 600 14px/1.25 var(--display); text-wrap: balance; }
.tip p { margin: 0; color: var(--dim); white-space: pre-wrap; max-height: 180px; overflow: hidden; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.empty div { text-align: center; max-width: 360px; padding: 0 16px; }
.empty h2 { margin: 0 0 6px; font: 600 18px/1.2 var(--display); }
.empty p { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.5; }
.now { position: absolute; z-index: 4; top: 64px; left: max(16px, env(safe-area-inset-left, 0px)); width: 272px; max-height: calc(100% - 150px);
  overflow: auto; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; scrollbar-width: none; }
.now::-webkit-scrollbar { display: none; }
.now h2 { margin: 0; font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.card { padding: 10px 11px; border-radius: 12px; background: var(--panel); border: 1px solid var(--faint); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font: 400 12px/1.35 var(--body); display: flex; flex-direction: column; gap: 7px; }
.card .who { display: flex; align-items: baseline; gap: 8px; }
.card .who b { font: 600 14px/1.2 var(--display); }
.card .who span { color: var(--dim); font: 400 10.5px/1 var(--mono); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
.bars { display: grid; grid-template-columns: 70px 1fr 32px; gap: 4px 8px; align-items: center; font: 400 10.5px/1.2 var(--mono); color: var(--dim); }
.bar { height: 5px; border-radius: 3px; background: var(--faint); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--accent)); transition: width .8s ease; }
.bars em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
.energy { font-size: 11.5px; color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span { font: 400 10.5px/1 var(--mono); padding: 4px 7px; border-radius: 999px; border: 1px solid var(--faint); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; font: 400 11px/1.35 var(--mono); color: var(--dim); }
.steps li.on { color: var(--fg); }
.steps li.on::before { content: "▶ "; color: var(--c, var(--accent)); }
.steps li.done { opacity: .55; text-decoration: line-through; }
.lbl { font: 500 9.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.sys { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font: 400 11px/1.3 var(--mono); }
.sys dt { color: var(--dim); } .sys dd { margin: 0; overflow-wrap: anywhere; }
/* Rooms browser: the rooms she remembers, their maps and camera memory. */
.pairing { align-self: center; font: 400 13px/1.4 var(--body); padding: 10px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--accent); text-align: center; }
.pairing b { font: 600 22px/1.2 var(--mono); letter-spacing: .12em; display: block; margin: 2px 0; }
.roomsBtn { font: 500 11px/1 var(--mono); letter-spacing: .06em; color: var(--fg); background: var(--panel); border: 1px solid var(--faint);
  border-radius: 999px; padding: 7px 12px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.roomsBtn:hover { border-color: var(--accent); } .roomsBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rooms { position: absolute; inset: 0; z-index: 8; display: grid; grid-template-columns: 300px 1fr; background: var(--bg); color: var(--fg); }
.rooms aside { border-right: 1px solid var(--faint); overflow: auto; padding: 14px 12px 20px; display: flex; flex-direction: column; gap: 8px; }
.rooms aside header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.rooms aside h2 { margin: 0; font: 600 17px/1.1 var(--display); margin-right: auto; }
.rooms .x { font: 400 18px/1 var(--body); background: none; border: 1px solid var(--faint); color: var(--fg); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; }
.rooms .x:focus-visible, .roomCard:focus-visible, .film button:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.roomCard { display: grid; grid-template-columns: 64px 1fr; gap: 10px; text-align: left; padding: 8px; border-radius: 12px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--faint); color: var(--fg); font: 400 12px/1.35 var(--body); }
.roomCard[aria-current="true"] { border-color: var(--accent); }
.roomCard img, .roomCard .noimg { width: 64px; height: 84px; object-fit: cover; border-radius: 8px; background: var(--faint); }
.roomCard b { display: block; font: 600 13.5px/1.25 var(--display); margin-bottom: 2px; overflow-wrap: anywhere; }
.roomCard small { display: block; color: var(--dim); font: 400 10.5px/1.45 var(--mono); }
.roomMain { overflow: auto; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.roomHead h3 { margin: 0 0 4px; font: 600 20px/1.2 var(--display); }
.roomHead p { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.5; max-width: 70ch; }
.roomHead .stats { margin-top: 6px; font: 400 11px/1.4 var(--mono); color: var(--dim); }
.roomBody { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.mapBox, .viewer { background: var(--panel); border: 1px solid var(--faint); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mapBox canvas { width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; display: block; cursor: crosshair; }
.mapKey { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 400 10.5px/1.3 var(--mono); color: var(--dim); }
.mapKey i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.lbl2 { font: 500 9.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.viewer .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.viewer .pics.blend { grid-template-columns: 1fr; position: relative; }
.viewer .pics img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 10px; background: var(--faint); display: block; }
.viewer .pics img.depth { image-rendering: pixelated; }
.viewer .pics.blend img.depth { position: absolute; top: 0; left: 0; width: 100%; height: 100%; aspect-ratio: auto; opacity: .55; mix-blend-mode: screen; }
.viewer .pics.nodepth { grid-template-columns: 1fr; }
.viewer .meta { font: 400 11px/1.45 var(--mono); color: var(--dim); }
.seg { display: inline-flex; border: 1px solid var(--faint); border-radius: 999px; overflow: hidden; margin-left: auto; }
.seg button { font: 400 10.5px/1 var(--mono); color: var(--dim); background: none; border: 0; padding: 6px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--fg); background: var(--faint); }
.film { display: grid; grid-auto-flow: column; grid-auto-columns: 78px; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
.film button { padding: 0; border: 2px solid transparent; border-radius: 9px; background: none; cursor: pointer; position: relative; }
.film button[aria-current="true"] { border-color: var(--accent); }
.film img { width: 74px; height: 98px; object-fit: cover; border-radius: 7px; display: block; background: var(--faint); }
.film time { position: absolute; left: 4px; bottom: 4px; font: 400 9.5px/1 var(--mono); color: #fff; text-shadow: 0 1px 3px #000; }
.film .more { display: grid; place-items: center; font: 400 11px/1.3 var(--mono); color: var(--dim); border: 1px dashed var(--faint); border-radius: 9px; height: 98px; }
.roomEmpty { color: var(--dim); font-size: 13px; padding: 30px 0; }
.live { background: var(--panel); border: 1px solid var(--faint); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 10px 18px; }
.live .think { font: 400 13.5px/1.55 var(--body); }
.live .think b { font: 600 16px/1.3 var(--display); display: block; margin: 4px 0 2px; }
.live .think q { display: block; color: var(--dim); font-style: italic; margin-top: 6px; quotes: none; }
.conf { display: inline-block; font: 500 10.5px/1 var(--mono); padding: 3px 7px; border-radius: 999px; border: 1px solid var(--faint); margin-left: 6px; vertical-align: 2px; }
.live .who { font: 400 12px/1.5 var(--body); }
.live .who div { padding: 3px 0; border-top: 1px solid var(--faint); } .live .who div:first-child { border-top: 0; }
.live .who b { font-weight: 600; }
.live .who small { color: var(--dim); font: 400 10.5px/1.4 var(--mono); display: block; }
.live details { grid-column: 1 / -1; font: 400 11px/1.5 var(--mono); color: var(--dim); }
.live details summary { cursor: pointer; } .live details li { margin: 4px 0; }
.live .elsewhere { grid-column: 1 / -1; font-size: 12.5px; color: var(--dim); }
.live .elsewhere button, .helpers button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
.pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #2fbf71; box-shadow: 0 0 8px #2fbf71; margin-right: 6px; animation: breathe 2.4s ease-in-out infinite; }
.helpers { margin-top: auto; padding: 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--faint); font: 400 11px/1.5 var(--mono); color: var(--dim); }
.helpers b { color: var(--fg); font-weight: 500; } .helpers ul { margin: 4px 0 0; padding-left: 14px; } .helpers li { margin: 2px 0; overflow-wrap: anywhere; }
.nowBadge { font: 500 9.5px/1 var(--mono); color: #2fbf71; letter-spacing: .08em; text-transform: uppercase; }
.maps { font: 400 11px/1.5 var(--mono); color: var(--dim); margin-top: 6px; } .maps li { margin: 2px 0; }
@media (max-width: 900px) { .live { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .rooms { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .rooms aside { border-right: 0; border-bottom: 1px solid var(--faint); max-height: 34vh; }
  .roomBody { grid-template-columns: 1fr; }
}
[hidden] { display: none !important; }
@media (max-width: 760px) {
  .feed { top: auto; bottom: 64px; left: 12px; right: 12px; width: auto; max-height: 34%; mask-image: none; -webkit-mask-image: none; overflow: auto; }
  .hint { display: none; }
  .now { top: 112px; left: 12px; right: 12px; width: auto; max-height: 22%; }
  .now .sysCard, .now .card .energy, .now .card .lbl, .now .card .steps { display: none; }
  .feed { max-height: 26%; }
}
</style>
</head>
<body>
<canvas id="sky" aria-label="The soul's mind: areas, what it knows, and live activity"></canvas>
<div class="empty" id="empty"><div><h2 id="emptyTitle">Waking the mind…</h2><p id="emptyText">Connecting to the brain.</p></div></div>
<div class="hud">
  <div class="top">
    <div class="brand"><h1>Soul Galaxy</h1><div class="sub" id="counts">—</div></div>
    <button class="roomsBtn" id="roomsBtn" type="button" aria-haspopup="dialog">Rooms</button>
    <span class="status" id="status" data-state="off"><i></i><span>Connecting</span></span>
  </div>
  <div class="pairing" id="pairing" role="status" hidden>Pairing code for your phone<b id="pairCode"></b><span id="pairUntil"></span></div>
  <div class="caption" id="caption" hidden><b id="captionKind">Heard</b><span id="captionText"></span></div>
  <div class="spacer"></div>
  <div class="bottom">
    <div class="legend" id="legend"></div>
    <input class="find" id="find" type="search" placeholder="Find a move, tool, memory…" aria-label="Find dots in the galaxy" autocomplete="off">
    <div class="hint">Drag to turn · scroll to zoom · hover a star</div>
  </div>
</div>
<section class="now" id="now" aria-label="Right now" hidden><h2>Right now</h2><div id="nowChars" style="display:contents"></div>
  <div class="card sysCard"><dl class="sys" id="nowSys"></dl></div></section>
<section class="feed" id="feed" aria-live="polite" aria-label="Thought stream"><h2>Thought stream</h2></section>
<section class="rooms" id="rooms" role="dialog" aria-modal="true" aria-label="Rooms she remembers" hidden>
  <aside><header><h2>Rooms</h2><button class="x" id="roomsClose" type="button" aria-label="Close rooms">×</button></header><div id="roomList" style="display:contents"></div>
    <div class="helpers" id="helpers" aria-live="polite">Helpers: —</div></aside>
  <div class="roomMain" id="roomMain"><div class="roomEmpty">Pick a room.</div></div>
</section>
<div class="tip" id="tip" hidden></div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const cv = $('#sky'), ctx = cv.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let dark = true, fgRGB = '226,232,241';
  function readTheme() {
    dark = getComputedStyle(document.documentElement).getPropertyValue('--mode').trim() !== 'light';
    fgRGB = dark ? '226,232,241' : '17,24,34';
  }
  readTheme();
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', readTheme);

  // ---------- state ----------
  const S = { areas: [], hue: {}, nodes: [], byId: new Map(), edges: [], isolate: null, connected: false, phone: '' };
  const areaLevel = {};          // recent activity per area (decays)
  const sparks = [];             // pulses travelling along paths
  const rings = [];              // expanding rings (births, wakes)
  let hovered = null, pinned = null, lastThink = 0;
  let yaw = 0.5, pitch = -0.28, zoom = 1, viewScale = 1, W = 0, H = 0, cx = 0, cy = 0;

  function col(area, a = 1) {
    const h = S.hue[area] ?? 210;
    if (area === 'mind') return dark ? `hsla(210,30%,92%,${a})` : `hsla(215,25%,22%,${a})`;
    return dark ? `hsla(${h},80%,66%,${a})` : `hsla(${h},64%,40%,${a})`;
  }
  function resize() {
    const dpr = Math.min(1.75, devicePixelRatio || 1), r = cv.getBoundingClientRect();
    W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // ---------- layout ----------
  const norm3 = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
  function fib(i, m) { const y = 1 - 2 * (i + .5) / m, r = Math.sqrt(Math.max(0, 1 - y * y)), th = i * 2.399963; return [Math.cos(th) * r, y, Math.sin(th) * r]; }
  function capPoint(dir, ang, phi) {
    const up = Math.abs(dir[1]) < .9 ? [0, 1, 0] : [1, 0, 0];
    const u = norm3([dir[1] * up[2] - dir[2] * up[1], dir[2] * up[0] - dir[0] * up[2], dir[0] * up[1] - dir[1] * up[0]]);

        <small class="meta">${esc(when(b.at))}${b.by ? ` · ${esc(b.by)}` : ''} · ${esc(rec)}${L.mapId ? ` · map ${esc(L.mapId.slice(0, 8))}` : ''}</small></div>`
      : `<div class="think"><span class="lbl2"><span class="pulse"></span>Where is she?</span><b>${esc(L.roomName || 'Not sure yet')}</b>A helper is working it out (needs background helpers running). ${esc(rec)}.</div>`;
    const who = `<div class="who"><span class="lbl2">Right now</span>${(L.characters ?? []).map((c) => `<div><b>${esc(c.name)}</b>${c.near ? ` · ${esc(c.near)}` : ''}<small>${esc(c.doing || 'resting')}</small></div>`).join('') || '<div>No character placed.</div>'}
      ${L.user ? `<div><b>You</b>${L.user.near ? ` · ${esc(L.user.near)}` : ''}</div>` : ''}</div>`;
    const elsewhere = !here && L.room ? `<div class="elsewhere">She's in ${esc(L.roomName || 'another room')} now · <button type="button" id="goLive">show that room</button></div>` : '';
    const hist = (L.beliefs ?? []).slice(1, 8);
    box.innerHTML = think + who + elsewhere + (hist.length ? `<details><summary>Earlier reasoning (${hist.length})</summary><ul>${hist.map((x) => `<li>${esc(when(x.at))} · <b>${esc(x.room)}</b> ${Math.round(x.confidence * 100)}% · ${esc(x.where)}<br>${esc(x.reasoning)}</li>`).join('')}</ul></details>` : '');
    $('#goLive')?.addEventListener('click', () => pick(L.room));
  }
  function renderHelpers() {
    const h = $('#helpers'); const J = R.live?.jobs; if (!h || !J) return;
    const busy = J.workers.filter((w) => w.busy);
    h.innerHTML = `<b>Helpers ${J.workers.length} of ${J.target}</b>${J.target === 0 ? ' · off (phone Settings)' : ''}${J.workers.length < J.target ? ' · more starting with the next wake' : ''}
      <ul>${busy.map((w) => `<li>${esc(w.name)}: ${esc(w.busy)}</li>`).join('')}${J.workers.filter((w) => !w.busy).length ? `<li>${J.workers.filter((w) => !w.busy).length} waiting for work</li>` : ''}</ul>
      ${J.queued.length ? `<div style="margin-top:6px">Queued: ${J.queued.map((q) => esc(q.title)).join(' · ')}</div>` : ''}
      ${J.done[0] ? `<div style="margin-top:6px">Last: ${esc(J.done[0].result).slice(0, 140)}</div>` : ''}`;
  }

  // ---------- map ----------
  function drawMap() {
    const c = $('#roomMap'); if (!c) return;
    const dpr = Math.min(2, devicePixelRatio || 1), size = c.getBoundingClientRect().width;
    c.width = Math.round(size * dpr); c.height = Math.round(size * dpr);
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, size, size);
    const m = R.map, light = css('--mode') === 'light';
    const C = light
      ? { bg: '#dfe4ea', free: '#f7f8fa', block: '#7a4a3c', memFree: '#e3ebf9', memBlock: '#b98a7c', text: '#111822' }
      : { bg: '#0b0f16', free: '#56627a', block: '#d27a5e', memFree: '#2c4166', memBlock: '#8a5443', text: '#e2e8f1' };
    document.documentElement.style.setProperty('--mapFree', C.free); document.documentElement.style.setProperty('--mapBlock', C.block);
    document.documentElement.style.setProperty('--mapMemFree', C.memFree); document.documentElement.style.setProperty('--mapMemBlock', C.memBlock);
    g.fillStyle = C.bg; g.fillRect(0, 0, size, size);
    // Bounds: the grid, things, places and the path.
    const livePts = R.live?.connected && R.live.room === R.room?.id ? [...(R.live.characters ?? []), ...(R.live.user ? [R.live.user] : [])] : [];
    const pts = [...(m?.things ?? []), ...(m?.places ?? []), ...(m?.path ?? []), ...livePts];
    let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
    if (m?.grid) { x0 = m.grid.originX; z0 = m.grid.originZ; x1 = x0 + m.grid.width * m.grid.cell; z1 = z0 + m.grid.height * m.grid.cell; }
    for (const p of pts) { x0 = Math.min(x0, p.x - 0.5); x1 = Math.max(x1, p.x + 0.5); z0 = Math.min(z0, p.z - 0.5); z1 = Math.max(z1, p.z + 0.5); }
    const note = $('#mapNote');
    if (!isFinite(x0)) { g.fillStyle = C.text; g.globalAlpha = .6; g.font = '13px Inter, system-ui'; g.textAlign = 'center'; g.fillText('No map of this room yet', size / 2, size / 2); g.globalAlpha = 1; if (note) note.textContent = ''; R.view = null; return; }
    const pad = 16, span = Math.max(x1 - x0, z1 - z0, 2), k = (size - pad * 2) / span;
    const ox = pad + ((size - pad * 2) - (x1 - x0) * k) / 2, oz = pad + ((size - pad * 2) - (z1 - z0) * k) / 2;
    const X = (x) => ox + (x - x0) * k, Z = (z) => oz + (z - z0) * k;
    R.view = { X, Z, k };
    if (m.grid) {
      const { originX, originZ, cell, rows } = m.grid, s = Math.max(1, cell * k + 0.6);
      const paint = { '.': C.free, '#': C.block, f: C.memFree, b: C.memBlock };
      for (let r = 0; r < rows.length; r++) for (let q = 0; q < rows[r].length; q++) {
        const col = paint[rows[r][q]]; if (!col) continue;
        g.fillStyle = col; g.fillRect(X(originX + q * cell), Z(originZ + r * cell), s, s);
      }
    }
    // 1 m scale bar.
    g.strokeStyle = C.text; g.globalAlpha = .55; g.lineWidth = 2; g.beginPath(); g.moveTo(pad, size - pad); g.lineTo(pad + k, size - pad); g.stroke();
    g.font = '10px "JetBrains Mono", monospace'; g.fillStyle = C.text; g.textAlign = 'left'; g.fillText('1 m', pad, size - pad - 5); g.globalAlpha = 1;
    // Camera path, older fainter.
    const path = m.path ?? [], accent = css('--accent') || '#8fb0ff';
    if (path.length) {
      const t0 = path[0].t, t1 = path.at(-1).t || t0 + 1;
      for (const p of path) { g.fillStyle = accent; g.globalAlpha = .18 + .62 * ((p.t - t0) / Math.max(1, t1 - t0)); g.beginPath(); g.arc(X(p.x), Z(p.z), 2.2, 0, Math.PI * 2); g.fill(); }
      g.globalAlpha = 1;
    }
    const cone = (p, color, r) => { // where the camera looked
      const a = p.yaw, L = 0.9 * k, spread = 0.45;
      g.fillStyle = color; g.globalAlpha = .28; g.beginPath(); g.moveTo(X(p.x), Z(p.z));
      g.lineTo(X(p.x) + Math.sin(a - spread) * L, Z(p.z) + Math.cos(a - spread) * L); g.lineTo(X(p.x) + Math.sin(a + spread) * L, Z(p.z) + Math.cos(a + spread) * L); g.closePath(); g.fill();
      g.globalAlpha = 1; g.beginPath(); g.arc(X(p.x), Z(p.z), r, 0, Math.PI * 2); g.fill(); };
    if (R.hover) cone(R.hover, accent, 4);
    if (R.frame) cone(R.frame, light ? '#c2410c' : '#ffb15c', 5);
    // Places and things with labels.
    g.font = '11px Inter, system-ui'; g.textAlign = 'left';
    const label = (x, y, t) => { g.lineWidth = 3; g.strokeStyle = C.bg; g.strokeText(t, x, y); g.fillStyle = C.text; g.fillText(t, x, y); };
    for (const p of m.places ?? []) { g.fillStyle = '#2fbf71'; g.save(); g.translate(X(p.x), Z(p.z)); g.rotate(Math.PI / 4); g.fillRect(-4, -4, 8, 8); g.restore(); label(X(p.x) + 7, Z(p.z) + 4, p.name); }
    for (const t of m.things ?? []) {
      g.fillStyle = t.kind === 'door' ? '#3fb37f' : t.kind === 'window' ? '#5aa9ff' : '#f2b84b';
      g.beginPath(); g.arc(X(t.x), Z(t.z), 4.5, 0, Math.PI * 2); g.fill(); label(X(t.x) + 7, Z(t.z) + 4, t.name);
    }
    // Live: her and the user, when she's in this room.
    if (R.live?.connected && R.live.room === R.room?.id) {
      for (const c of R.live.characters ?? []) {
        g.fillStyle = '#ff5aaa'; g.beginPath(); g.arc(X(c.x), Z(c.z), 6, 0, Math.PI * 2); g.fill();
        g.strokeStyle = '#ff5aaa'; g.lineWidth = 2; g.beginPath(); g.moveTo(X(c.x), Z(c.z)); g.lineTo(X(c.x) + Math.sin(c.yaw) * 14, Z(c.z) + Math.cos(c.yaw) * 14); g.stroke();
        label(X(c.x) + 9, Z(c.z) - 6, c.name);
      }
      if (R.live.user) {
        const u = R.live.user, a = u.yaw;
        g.fillStyle = C.text; g.beginPath();
        g.moveTo(X(u.x) + Math.sin(a) * 10, Z(u.z) + Math.cos(a) * 10);
        g.lineTo(X(u.x) + Math.sin(a + 2.5) * 7, Z(u.z) + Math.cos(a + 2.5) * 7);
        g.lineTo(X(u.x) + Math.sin(a - 2.5) * 7, Z(u.z) + Math.cos(a - 2.5) * 7); g.closePath(); g.fill();
        label(X(u.x) + 9, Z(u.z) + 12, 'you');
      }
    }
    if (note) note.textContent = `${(x1 - x0).toFixed(1)} × ${(z1 - z0).toFixed(1)} m shown · ${path.length} camera positions${m.grid ? '' : ' · no LiDAR scan or depth yet'}`;
  }
  function nearestPath(e) {
    if (!R.view || !R.map?.path?.length) return null;
    const r = e.currentTarget.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    let best = null, bd = 10;
    for (const p of R.map.path) { const d = Math.hypot(R.view.X(p.x) - mx, R.view.Z(p.z) - my); if (d < bd) { bd = d; best = p; } }
    return best;
  }
  addEventListener('resize', () => { if (!panel.hidden) drawMap(); });
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (!panel.hidden) drawMap(); });
  if (location.hash === '#rooms') setTimeout(open, 0);
  // A phone asking to pair: show the code here too.
  async function pollPairing() {
    try {
      const p = await (await fetch('/pairing', { cache: 'no-store' })).json();
      const box = $('#pairing');
      box.hidden = !p.code;
      if (p.code) { $('#pairCode').textContent = `${p.code.code.slice(0, 3)} ${p.code.code.slice(3)}`; $('#pairUntil').textContent = `enter it on the phone · valid until ${new Date(p.code.until).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}`; }
    } catch {}
  }
  setInterval(pollPairing, 3000); pollPairing();
  addEventListener('hashchange', () => { if (location.hash === '#rooms' && panel.hidden) open(); });
})();
</script>
</body>
</html>
